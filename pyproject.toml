[project]
name = "ai-engineering-from-scratch"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0",
    "anthropic>=0.20",
    "numpy",
    "matplotlib",
    "pandas",
    "scikit-learn",
    "jupyterlab",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
]
